version: '3.8'

services:
  app:
    build: ./server
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=thefarmers
      - JWT_SECRET=supersecret
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: thefarmers
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
